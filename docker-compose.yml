# Local full stack: PostgreSQL + API + web.  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rd
      POSTGRES_PASSWORD: rd
      POSTGRES_DB: roktodoot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://rd:rd@db:5432/roktodoot
      CORS_ORIGINS: http://localhost:3000
      SECONDS_PER_MINUTE: "3"
    ports: ["8000:8000"]
    depends_on: [db]
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    image: node:20
    working_dir: /app
    volumes: [./frontend:/app]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    command: sh -c "npm ci && npm run build && npm start"
    depends_on: [api]

volumes:
  pgdata:
